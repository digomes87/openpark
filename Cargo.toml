[package]
name = "openpark"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "A RollerCoaster Tycoon-flavoured park simulator, built on the isogrid isometric engine."
authors = ["Diego Gomes <diego.gomes87@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/digomes87/openpark"
homepage = "https://github.com/digomes87/openpark"
readme = "README.md"
keywords = ["game", "simulation", "isometric", "tycoon"]
categories = ["games"]
publish = false

[dependencies]
# Tracked by branch until the engine's renderer lands on `main`; moves to a
# version from crates.io at the engine's first release.
isogrid = { git = "https://github.com/digomes87/isogrid", branch = "feat/renderer", features = [
  "macroquad-backend",
  "serde",
] }
anyhow = "1"
macroquad = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
insta = { version = "1", features = ["ron"] }
proptest = "1"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "thin"

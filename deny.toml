[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # Both reach us through `macroquad`, the rendering backend. The reasoning is
  # in the engine's ADR 0004, which this game inherits by choosing that backend:
  # https://github.com/digomes87/isogrid/blob/main/docs/adr/0004-macroquad-first.md
  #
  # Revisit if a fixed macroquad appears, or when a backend without an open
  # soundness advisory is available.
  "RUSTSEC-2025-0035", # macroquad: soundness, no fix available
  "RUSTSEC-2026-0192", # ttf-parser (via fontdue): unmaintained
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
